# web/ の Web版（iPhone などアプリを入れられない人向け）を GitHub Pages に公開する。
# Supabase の接続先は、リポジトリの Settings > Secrets and variables > Actions > Variables の
# SUPABASE_URL と SUPABASE_KEY（アプリと同じ publishable キー。読み取り専用なので公開されても問題ない）から作る。
name: Web版を公開

on:
  push:
    branches: [master]
    paths: ['web/**', '.github/workflows/web-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 接続先を書き出す
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Variables の SUPABASE_URL と SUPABASE_KEY を設定してください"
            exit 1
          fi
          printf 'window.KEIBA_CONFIG = { url: "%s", key: "%s" };\n' "$SUPABASE_URL" "$SUPABASE_KEY" > web/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
