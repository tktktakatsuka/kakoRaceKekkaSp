plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics' // Crashlyticsプラグイン
    alias(libs.plugins.jetbrains.kotlin.android)
    alias(libs.plugins.kotlin.serialization)
}

// Supabaseの接続情報は local.properties から読み込む
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// リリース用の署名情報は keystore.properties から読み込む（Git には入れない。keystore.properties.example を参照）
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = 'com.tktkcompany.kakoRaceKeiba'

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties.getProperty('storeFile'))
                storePassword = keystoreProperties.getProperty('storePassword')
                keyAlias = keystoreProperties.getProperty('keyAlias')
                keyPassword = keystoreProperties.getProperty('keyPassword')
            }
        }
    }
    compileSdk = 36

    defaultConfig {
        applicationId = "com.tktkcompany.kakoRaceKeiba"
        minSdk = 28
        targetSdk = 36
        versionCode = 393
        versionName = "1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "SUPABASE_URL", "\"${localProperties.getProperty('SUPABASE_URL', '')}\""
        buildConfigField "String", "SUPABASE_KEY", "\"${localProperties.getProperty('SUPABASE_KEY', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('releaseWithDebugKey')) {
                // 難読化したリリース版を、データを消さずに手元の端末で試すため（debug 版の上に入れられる）
                signingConfig = signingConfigs.debug
            } else if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // 単体テストは日本語の文面で確かめる（PC の言語に左右されないよう固定する）
    testOptions {
        unitTests.all {
            systemProperty 'user.language', 'ja'
            systemProperty 'user.country', 'JP'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    sourceSets {
        // それぞれのビルドタイプごとに異なるAndroidManifest.xmlを使用する
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }
}

dependencies {
    // Firebase (BOMを使用)
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.crashlytics
    implementation libs.firebase.auth
    implementation libs.firebase.messaging
    implementation libs.firebase.database

    // Google Identity & Ads
    implementation libs.googleid
    implementation libs.credentials
    implementation libs.credentials.play.services.auth
    implementation libs.play.services.auth
    implementation libs.play.services.ads.v2450
    implementation libs.play.app.update
    implementation libs.play.review

    // AndroidX & UI
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.androidx.activity
    implementation libs.work.runtime

    // Supabase (レース結果・レース傾向の取得元)
    implementation libs.supabase.postgrest
    implementation libs.ktor.client.android
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.serialization.json

    // Network & Utils
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.logging.interceptor
    implementation libs.threetenabp
    implementation libs.mpandroidchart
    implementation libs.annotation

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}